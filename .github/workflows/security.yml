name: Security

# 새 보안 취약점과 위험한 의존성을 PR 단계에서 탐지한다. 배포는 수행하지 않는다.
on:
  push:
    branches: [main, dev, integration]
  pull_request:
    # base 변경으로 의존성 비교 범위가 바뀌면 보안 검사도 다시 실행한다.
    types: [opened, synchronize, reopened, edited]
    branches: [main, dev, integration]
  merge_group:
  schedule:
    - cron: "42 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v7
      - name: CodeQL 초기화
        uses: github/codeql-action/init@v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - name: CodeQL 분석 및 결과 등록
        uses: github/codeql-action/analyze@v4.39.1
        with:
          category: "/language:${{ matrix.language }}"

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: 신규 의존성 취약점 검사
        uses: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: high

  # security.md SC-01 · SC-02 · T19: 잠금 파일 의존성과 코드 규칙을 PR마다 본다. 도구 판은 고정한다
  audit:
    name: Audit (pip-audit · pnpm audit · bandit · semgrep)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: 백엔드 운영 의존성 취약점 (pip-audit, 하나라도 있으면 실패)
        working-directory: backend
        run: |
          uv export --frozen --no-dev --format requirements-txt > "$RUNNER_TEMP/req-prod.txt"
          uvx pip-audit==2.10.1 --disable-pip -r "$RUNNER_TEMP/req-prod.txt"
      - name: 백엔드 정적 점검 (bandit, 중간 이상이면 실패)
        working-directory: backend
        run: uvx bandit==1.9.4 -r app -ll
      - name: 규칙 점검 (semgrep, 찾으면 실패)
        run: >-
          uvx semgrep==1.186.0 scan --metrics=off --error
          --config p/python --config p/typescript --config p/react --config p/nextjs
          --config p/security-audit --config p/secrets --config p/owasp-top-ten
          backend/app frontend/app frontend/components frontend/lib frontend/proxy.ts
      - uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: 프런트 운영 의존성 취약점 (pnpm audit, high 이상이면 실패)
        working-directory: frontend
        run: pnpm audit --prod --audit-level high
