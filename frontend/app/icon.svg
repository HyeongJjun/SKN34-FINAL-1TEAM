<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- 믿집 표시: 지붕 + 'ㅁ' 칸. 색은 tokens.css의 mj-primary(#1b66d8)와 같은 값이다. 파비콘은 CSS 변수를 못 읽어서 값을 직접 쓴다. 설치 아이콘(PNG)은 app/icons/mark.tsx. 이 주석 안에는 하이픈 두 개를 잇달아 쓰지 않는다(XML 주석 규칙, 어기면 그림이 안 나온다) -->
  <rect width="32" height="32" rx="8" fill="#1b66d8"/>
  <path d="M6.5 14.5 16 7l9.5 7.5" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="10" y="14.5" width="12" height="10.5" rx="1.5" fill="none" stroke="#fff" stroke-width="2.6"/>
</svg>
